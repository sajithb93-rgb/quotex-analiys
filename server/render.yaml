services:
  - type: web
    name: quotex-live-bridge
    runtime: python
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn quotex_bridge:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: QUOTEX_EMAIL
        sync: false
      - key: QUOTEX_PASSWORD
        sync: false
      - key: QUOTEX_SSID
        sync: false
      - key: QUOTEX_COOKIES
        sync: false
      - key: QUOTEX_SESSION_JSON
        sync: false
      - key: QUOTEX_USER_AGENT
        value: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36
      - key: QUOTEX_HOST
        value: qxbroker.com
      - key: ALLOWED_ORIGINS
        sync: false
